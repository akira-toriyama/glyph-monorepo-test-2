name: release-binary-probe
on:
  workflow_dispatch:
    inputs:
      dry_run: { description: "Preview only", type: boolean, default: true }
permissions:
  contents: write
jobs:
  release:
    uses: akira-toriyama/glyph/.github/workflows/release.yml@v6.1.0
    with:
      binary: probe
      dry-run: ${{ github.event.inputs.dry_run == 'true' }}
      install-notes: |
        ## Install

        probe: the binary input on a packages repository.
